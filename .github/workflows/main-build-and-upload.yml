name: Build and Upload

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: read-all

jobs:
  build-dist:
    name: Build and Upload
    uses: ./.github/workflows/verify-build.yml
    with:
      release: true
      runner-archs: '["amd64", "arm64"]'
      package: 'virtio-accel'
      options: ''
      upload-subpath: 'virtio-accel'
    secrets: inherit
